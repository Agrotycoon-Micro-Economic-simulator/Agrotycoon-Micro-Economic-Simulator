<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotycoon - Peta Dunia</title>
<link rel="stylesheet" href="css/style.css">
<style>
 #map-wrap{position:relative;width:100%;height:62vh;background:#263238;border-radius:10px;overflow:hidden}
 #map-canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
 #hud{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 12px;font-weight:bold;z-index:5;font-size:13px}
 .float-gold{position:absolute;font-weight:bold;color:#FFD54F;text-shadow:0 0 4px #000;animation:rise 1.2s forwards;pointer-events:none;z-index:6}
 @keyframes rise{to{transform:translateY(-60px);opacity:0}}
 #detail-view{position:fixed;inset:0;background:#000;z-index:60;display:none}
 #dv-bg{width:100%;height:100%;object-fit:cover}
 #dv-title{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:8px;font-weight:bold}
 #dv-close{position:absolute;top:12px;right:12px;z-index:5}
 .hotspot{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border:2px solid #4CAF50;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:pulse 2s infinite}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,.5)}50%{box-shadow:0 0 0 10px rgba(76,175,80,0)}}
 #dv-toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 18px;border-radius:10px;display:none;max-width:80%;text-align:center}
</style>
</head>
<body>
<div class="container">
 <header><h1>🗺️ Peta Dunia</h1><a class="link" href="index.html">⬅ Kembali ke Desa</a></header>
 <div id="map-wrap">
  <canvas id="map-canvas"></canvas>
  <div id="hud">💰 <span id="hud-gold"></span> | 🌍 <span id="hud-owned"></span> Ha</div>
 </div>
 <div class="actions">
  <button class="btn btn-success" onclick="MapEngine.sendTruck()">🚚 Kirim Truk ke Pasar (Jual)</button>
  <button class="btn btn-primary" id="btn-pasar" onclick="MapEngine.buildPasarInduk()" style="display:none">🏬 Bangun Pasar Induk (Rp 50 jt, min 5 Ha)</button>
 </div>
</div>
<div id="detail-view">
 <img id="dv-bg" alt="">
 <div id="dv-title"></div>
 <button class="btn btn-danger" id="dv-close" onclick="MapEngine.closeDetail()">⬅ Peta</button>
 <div id="dv-hotspots"></div>
 <div id="dv-toast"></div>
</div>
<script src="js/map_engine.js"></script>
</body>
</html>
