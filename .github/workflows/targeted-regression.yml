name: Targeted Regression Tests

on:
  push:
    branches:
      - feat/production-tier-taxonomy
    paths:
      - ".github/workflows/targeted-regression.yml"
      - "js/**"
      - "tests/**"
      - "*.html"
      - "css/**"
  pull_request:
    branches:
      - main
    paths:
      - "js/**"
      - "tests/**"
      - ".github/workflows/targeted-regression.yml"
      - "*.html"
      - "css/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium for browser smoke test
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run all standalone Node regression tests
        run: |
          set -e
          node tests/accounting_ledger.test.js
          node tests/commodity_tier_chain.test.js
          node tests/commodity_transformation.test.js
          node tests/double_entry_transactions.test.js
          node tests/economy_harvest.test.js
          node tests/es_kelapa_benchmark.test.js
          node tests/finance.test.js
          node tests/household_inventory_accounting.test.js
          node tests/living_stock.test.js
          node tests/market_chain_contract.test.js
          node tests/payroll_accounting.test.js
          node tests/production_tiers.test.js
          node tests/real_economic_data.test.js
          node tests/unit_economics.test.js
          node tests/world_simulation.test.js
          node tests/browser_smoke.test.js
