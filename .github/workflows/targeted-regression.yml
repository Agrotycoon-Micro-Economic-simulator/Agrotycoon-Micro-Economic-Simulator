name: Targeted Regression Tests

on:
  push:
    branches:
      - feat/production-tier-taxonomy
    paths:
      - ".github/workflows/targeted-regression.yml"
      - "js/**"
      - "tests/**"
      - "*.html"
      - "css/**"
  pull_request:
    branches:
      - main
    paths:
      - "js/**"
      - "tests/**"
      - ".github/workflows/targeted-regression.yml"
      - "*.html"
      - "css/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium for browser smoke test
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Node test-runner suites for market, NPC economy, and inventory accounting
        run: node --test tests/background-economy.test.js tests/market-engine.test.js tests/accounting-inventory.test.js
      - name: Run UTL oil-palm benchmark source and arithmetic guard
        run: node tests/utl-oil-palm-benchmark.test.js
      - name: Run UTP broiler benchmark provenance and arithmetic guard
        run: node tests/utp-broiler-benchmark.test.js
      - name: Run UTP cattle benchmark provenance and arithmetic guard
        run: node tests/utp-livestock-benchmarks.test.js
      - name: Run all standalone Node regression tests
        run: |
          set -e
          node tests/accounting_ledger.test.js
          node tests/commodity_tier_chain.test.js
          node tests/commodity_transformation.test.js
          node tests/double_entry_transactions.test.js
          node tests/economy_harvest.test.js
          node tests/es_kelapa_benchmark.test.js
          node tests/finance.test.js
          node tests/household_inventory_accounting.test.js
          node tests/living_stock.test.js
          node tests/market_chain_contract.test.js
          node tests/payroll_accounting.test.js
          node tests/production_tiers.test.js
          node tests/real_economic_data.test.js
          node tests/rice-national-demand.test.js
          node tests/maize-national-demand.test.js
          node tests/unit_economics.test.js
          node tests/world_simulation.test.js
          node tests/browser_smoke.test.js
          node tests/gameplay_e2e.test.js
          node tests/finance_payroll_e2e.test.js
          node tests/legacy_save_migration_e2e.test.js
          node tests/corrupt_save_recovery_e2e.test.js
