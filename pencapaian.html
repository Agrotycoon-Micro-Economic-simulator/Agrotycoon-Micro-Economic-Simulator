<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotycoon - Pencapaian</title>
<link rel="stylesheet" href="css/style.css">
<style>
 .ach-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
 .btn-back { background: #2196F3; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; }
 .progress-bar { width: 100%; height: 30px; background: #e0e0e0; border-radius: 15px; overflow: hidden; margin: 15px 0; }
 .progress-fill { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; transition: width 0.5s; }
 .category { margin: 20px 0; }
 .category h3 { color: #2E7D32; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; margin-bottom: 10px; }
 .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
 .ach-card { background: #f5f5f5; padding: 15px; border-radius: 10px; border-left: 4px solid #ccc; transition: all 0.3s; }
 .ach-card.unlocked { background: #e8f5e9; border-left-color: #4CAF50; box-shadow: 0 2px 8px rgba(76,175,80,0.3); }
 .ach-card.locked { opacity: 0.6; }
 .ach-card .ach-icon { font-size: 2em; margin-right: 10px; }
 .ach-card .ach-name { font-weight: bold; font-size: 1.1em; }
 .ach-card .ach-desc { font-size: 0.9em; color: #666; margin-top: 5px; }
 .ach-card .ach-status { font-size: 0.8em; margin-top: 8px; font-weight: bold; }
 .ach-card.unlocked .ach-status { color: #4CAF50; }
 .ach-card.locked .ach-status { color: #999; }
 .achievement-notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #FFD700, #FFA500); padding: 15px 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999; transition: top 0.5s; }
 .achievement-notif.show { top: 20px; }
 .notif-content { display: flex; align-items: center; gap: 15px; }
 .notif-icon { font-size: 2.5em; }
 .notif-title { font-size: 0.8em; color: #333; font-weight: bold; }
 .notif-name { font-size: 1.1em; color: #000; font-weight: bold; }
</style>
</head>
<body><button id="menuToggle" aria-label="Buka menu" style="position:fixed;z-index:501;top:12px;left:12px;width:46px;height:46px;border:1px solid #285548;border-radius:12px;background:#0b1121;color:#10b981;font-size:24px;cursor:pointer">☰</button><nav id="sideMenu" style="position:fixed;z-index:502;inset:0 auto 0 0;width:min(310px,86vw);padding:18px;background:#0b1121;transform:translateX(-110%);transition:transform .2s;display:flex;flex-direction:column;gap:7px"><div style="display:flex;justify-content:space-between;padding:8px 0 16px;color:#e8eef8"><strong>🌾 Agrotycoon</strong><button id="menuClose" style="background:none;color:white;border:0;font-size:24px">×</button></div><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="index.html">🏡 Permainan</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="stock.html">📦 Stok & Gudang</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="akuntansi.html">📊 Akuntansi</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="assets.html">🏞️ Aset & Karyawan</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="kemajuan.html">⭐ Level & Pembukaan Fitur</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="pasar-komoditas.html">🧭 Pasar Komoditas</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="dunia-simulasi.html">🌏 Dunia Simulasi</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="impor-data.html">🧾 Impor Data Historis</a><a style="padding:12px;border:1px solid #263750;border-radius:9px;background:#121c30;color:#e8eef8;text-decoration:none" href="pencapaian.html">🏆 Pencapaian</a></nav><div id="menuShade" style="position:fixed;z-index:500;inset:0;background:#0008;display:none"></div><script>(function(){var m=document.getElementById('sideMenu'),s=document.getElementById('menuShade');function close(){m.style.transform='translateX(-110%)';s.style.display='none'}document.getElementById('menuToggle').onclick=function(){m.style.transform='translateX(0)';s.style.display='block'};document.getElementById('menuClose').onclick=close;s.onclick=close;document.addEventListener('keydown',function(e){if(e.key==='Escape')close()})})();</script><style>body{padding-top:60px!important}</style>
<div class="container">
 <div class="ach-header">
  <h1>🏆 Pencapaian</h1>
  <a href="index.html" class="btn-back">⬅ Kembali ke Desa</a>
 </div>
 
 <div class="panel">
  <h3>Progress Pencapaian</h3>
  <div class="progress-bar">
   <div class="progress-fill" id="progress-fill">0%</div>
  </div>
  <p id="progress-text">0 dari 0 achievement terbuka</p>
 </div>
 
 <div id="ach-container"></div>
</div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/achievement.js"></script>
<script>
 loadSaved();
 
 const progress = getAchievementProgress();
 const progressFill = document.getElementById('progress-fill');
 const progressText = document.getElementById('progress-text');
 progressFill.style.width = progress.percentage + '%';
 progressFill.textContent = progress.percentage + '%';
 progressText.textContent = progress.unlocked + ' dari ' + progress.total + ' achievement terbuka';
 
 const categories = getAchievementsByCategory();
 const container = document.getElementById('ach-container');
 let html = '';
 
 Object.keys(categories).forEach(cat => {
  html += '<div class="category">';
  html += '<h3>' + cat + '</h3>';
  html += '<div class="ach-grid">';
  categories[cat].forEach(ach => {
   html += '<div class="ach-card ' + (ach.unlocked ? 'unlocked' : 'locked') + '">';
   html += '<div style="display:flex;align-items:center">';
   html += '<span class="ach-icon">' + ach.icon + '</span>';
   html += '<div>';
   html += '<div class="ach-name">' + ach.name + '</div>';
   html += '<div class="ach-desc">' + ach.desc + '</div>';
   html += '<div class="ach-status">' + (ach.unlocked ? '✅ TERBUKA' : '🔒 TERKUNCI') + '</div>';
   html += '</div></div>';
   html += '</div>';
  });
  html += '</div></div>';
 });
 
 container.innerHTML = html;
</script>
</body>
</html>
