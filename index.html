<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrotycoon - Simulasi Ekonomi Desa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<header><h1>🌾 Agrotycoon</h1><p>Simulasi Ekonomi Mikro Berbasis Data Nyata</p>
<a class="link" href="akuntansi.html">📊 Laporan Akuntansi</a></header>

<div id="onboard" class="hidden">
  <div id="ob-char" class="panel">
    <h2>Siapa nama Anda, Kepala Desa?</h2>
    <input id="inp-name" placeholder="Nama Anda..." maxlength="20">
    <div id="avatar-pick"></div>
    <button class="btn btn-primary" onclick="OB.startStory()">Mulai Perjalanan</button>
  </div>
  <div id="ob-story" class="panel hidden">
    <div class="dialog"><div class="portrait" id="st-portrait"></div>
    <div><strong id="st-speaker"></strong><p id="st-text"></p></div></div>
    <button class="btn btn-primary" onclick="OB.nextSlide()">Lanjut ➡</button>
  </div>
</div>

<div id="game" class="hidden">
  <div class="stats-bar">
    <div class="stat">💰 <span id="s-gold"></span></div>
    <div class="stat">📅 Hari <span id="s-day"></span> (Bln <span id="s-month"></span>)</div>
    <div class="stat">🕒 <span id="s-phase"></span></div>
    <div class="stat">🥥 <span id="s-stock"></span></div>
  </div>
  <div class="dialog"><div class="portrait" id="d-portrait"></div>
  <div><strong id="d-speaker"></strong><p id="d-text"></p></div></div>
  <div id="actions" class="actions"></div>
  <div id="msg" class="message hidden"></div>
</div>
</div>
<div id="modal" class="modal hidden"><div class="modal-content" id="modal-body"></div></div>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/economy.js"></script>
<script src="js/day.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
